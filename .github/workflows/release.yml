name: Release App (Signed with Debug Key)

on:
  push:
    tags:
      - 'v*' # Kích hoạt khi push tag dạng v1.0.0, v0.1.0, ...

permissions:
  contents: write # Quyền tạo Release và upload APK file

jobs:
  build-and-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Lấy toàn bộ lịch sử để tạo release notes tự động

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK (Signed with Debug Key)
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          # Sao chép và gắn tag phiên bản vào tên file APK
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/SignBridge-${{ github.ref_name }}.apk
          echo "Artifact prepared at release-artifacts/SignBridge-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SignBridge ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
